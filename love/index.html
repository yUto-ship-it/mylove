<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Padauk', sans-serif;
        }

        /* 1. အသက်ဝင်လှုပ်ရှားနေသည့် နောက်ခံ (Animated Background) */
        body {
            background: linear-gradient(-45deg, #0d0814, #2a0821, #1b102b, #3b0a2a, #0f0a1c);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: pointer;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Floating Glow Bulbs (မီးရောင် အလင်းလုံးများ) */
        .bg-glow-1 {
            position: fixed;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(255, 117, 140, 0.35) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            top: 10%;
            left: 10%;
            animation: floatGlow1 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: fixed;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(142, 68, 173, 0.35) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            bottom: 10%;
            right: 10%;
            animation: floatGlow2 10s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* Card Container */
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            animation: fadeIn 1.2s ease-in-out;
            position: relative;
            z-index: 2;
        }

        .image-container {
            width: 100%;
            height: 380px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .image-container img:hover {
            transform: scale(1.05);
        }

        .heart {
            color: #ff4757;
            font-size: 1.5rem;
            margin-bottom: 12px;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        .lyrics {
            font-size: 0.95rem;
            line-height: 2;
            color: #ebdada;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            min-height: 240px;
            text-align: center;
        }

        .highlight {
            color: #ff9a9e;
            font-weight: bold;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: #ff9a9e;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        .hashtag {
            margin-top: 18px;
            font-size: 1rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .hashtag:hover {
            color: #ff758c;
        }

        /* 2. သီချင်းမဖွင့်ခင် ပိုမိုလှပဆန်းသစ်သော Play Overlay & Glowing Button */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 6, 20, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .play-btn {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 15px 32px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 117, 140, 0.6), 0 0 50px rgba(255, 117, 140, 0.3);
            animation: pulseGlow 2s infinite;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s ease;
        }

        .play-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #ff4757, #ff758c);
        }

        .play-subtext {
            margin-top: 15px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
            animation: fadeInOut 2s infinite alternate;
        }

        audio {
            width: 100%;
            margin-top: 10px;
            filter: invert(0.9);
            outline: none;
        }

        /* Animations */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatGlow1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.2); }
        }

        @keyframes floatGlow2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-40px, -50px) scale(1.25); }
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 20px rgba(255, 117, 140, 0.6), 0 0 40px rgba(255, 117, 140, 0.2);
            }
            50% {
                box-shadow: 0 0 35px rgba(255, 117, 140, 0.9), 0 0 60px rgba(255, 117, 140, 0.5);
            }
            100% {
                box-shadow: 0 0 20px rgba(255, 117, 140, 0.6), 0 0 40px rgba(255, 117, 140, 0.2);
            }
        }

        @keyframes fadeInOut {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="card">
        <div class="play-overlay" id="overlay">
            <button class="play-btn">
                <span>🎵</span> သီချင်းနားထောင်ရန် နှိပ်ပါ
            </button>
            <div class="play-subtext">✨ Screen ကို နှိပ်ပြီး စာသားများကြည့်ပါ ✨</div>
        </div>

        <div class="image-container">
            <img src="a.jpg" alt="My Photo">
        </div>

        <div class="heart">❤️</div>
        
        <div class="lyrics" id="typewriter"></div>

        <audio id="audio" controls loop>
            <source src="song.mp3" type="audio/mpeg">
        </audio>

        <div class="hashtag">#K</div>
    </div>

    <script>
        const lyricsData = [
            { time: 0.0, text: "ရောမရဲ့ နေထွက်ချိန်ကစ...", highlight: false },
            { time: 1.8, text: "ပုဂံပြည်ရဲ့ နေဝင်ချိန်အဆုံး...", highlight: false },
            { time: 3.8, text: "အတူတူ ကြည့်ချင်တယ်...", highlight: true, breakAfter: true },
            { time: 5.8, text: "မတပ်မက်မိအောင် နေရင်းနဲ့ပဲ...", highlight: false },
            { time: 7.5, text: "သဘောကျနေတဲ့ ပင်မြင့်ထက်က", highlight: false },
            { time: 9.2, text: "သဇင်ပန်းလေးလို တင်စားရတဲ့ အချစ်ရယ်...", highlight: false, breakAfter: true },
            { time: 11.2, text: "မပိုင်ဆိုင်ရရင်တောင်...", highlight: false },
            { time: 12.8, text: "ချစ်တာလေးတော့...", highlight: false },
            { time: 14.5, text: "အချစ်ကို သိစေချင်တယ်။", highlight: true }
        ];

        const audio = document.getElementById('audio');
        const container = document.getElementById('typewriter');
        const overlay = document.getElementById('overlay');
        
        let currentLineIndex = -1;
        let activeCursor = null;

        function getGraphemes(text) {
            const segmenter = new Intl.Segmenter('my', { granularity: 'grapheme' });
            return Array.from(segmenter.segment(text), s => s.segment);
        }

        async function typeLine(lineData, nextTime) {
            const lineSpan = document.createElement('span');
            if (lineData.highlight) lineSpan.className = 'highlight';
            
            container.appendChild(lineSpan);

            if (!activeCursor) {
                activeCursor = document.createElement('span');
                activeCursor.className = 'cursor';
            }
            container.appendChild(activeCursor);

            const chars = getGraphemes(lineData.text);
            const availableDuration = (nextTime ? nextTime - lineData.time : 2.5) * 1000;
            const charDelay = Math.max(40, Math.min(100, availableDuration / chars.length));

            for (let char of chars) {
                if (audio.paused) break;
                lineSpan.textContent += char;
                await new Promise(r => setTimeout(r, charDelay));
            }

            if (lineData.breakAfter) {
                container.insertBefore(document.createElement('br'), activeCursor);
                container.insertBefore(document.createElement('br'), activeCursor);
            } else {
                container.insertBefore(document.createElement('br'), activeCursor);
            }
        }

        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;

            if (currentTime < 0.5 && currentLineIndex > 0) {
                container.innerHTML = '';
                currentLineIndex = -1;
                activeCursor = null;
            }

            for (let i = 0; i < lyricsData.length; i++) {
                if (i > currentLineIndex && currentTime >= lyricsData[i].time) {
                    currentLineIndex = i;
                    const nextTime = lyricsData[i + 1] ? lyricsData[i + 1].time : null;
                    typeLine(lyricsData[i], nextTime);
                    break;
                }
            }
        });

        function startExperience() {
            audio.play().then(() => {
                overlay.style.opacity = '0';
                overlay.style.transform = 'scale(1.05)';
                setTimeout(() => overlay.style.display = 'none', 800);
            }).catch(err => {
                console.log("Autoplay issue: ", err);
            });
        }

        document.body.addEventListener('click', startExperience, { once: true });
    </script>

</body>
</html>
